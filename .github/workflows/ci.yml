name: CI

on:
  push:
    branches:
      - main
      - julia-fractals
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      # Formats in place, then fails with the exact diff if anything changed. JuliaFormatter is
      # pinned so a new release can't change the expected output without a code change.
      - name: Check formatting
        shell: bash
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.add(name="JuliaFormatter", version="1.0.62")
            using JuliaFormatter
            format(["Fractals.jl/src", "Fractals.jl/test", "IFSParse.jl/src", "IFSParse.jl/test"]; overwrite=true)
          '
          if ! git diff --exit-code -- Fractals.jl/src Fractals.jl/test IFSParse.jl/src IFSParse.jl/test; then
            echo "::error title=Formatting::Fractals.jl/src, Fractals.jl/test, IFSParse.jl/src or IFSParse.jl/test is not JuliaFormatter-formatted. Run the formatter (see README) and commit the result."
            exit 1
          fi

  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Run IFSParse tests
        shell: bash
        run: |
          julia --startup-file=no --project=IFSParse.jl -e 'using Pkg; Pkg.instantiate()'
          julia --startup-file=no --project=IFSParse.jl IFSParse.jl/test/runtests.jl

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=Fractals.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        shell: bash
        env:
          FRACTALS_RUN_GPU_TESTS: "0"
          FRACTALS_RUN_CLI_BENCH_TESTS: "0"
        run: julia --startup-file=no --project=Fractals.jl Fractals.jl/test/runtests.jl

      - name: Instantiate DrWatson project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Smoke-test DrWatson project render
        shell: bash
        env:
          FRACTALS_OUTPUT_ROOT: ${{ runner.temp }}/fractals-output
        run: >
          julia --startup-file=no --project=. -e
          'using Fractals; render(get_ifs("Sierpinski"; file = "Default.ifs"), Chaos(npoints = 2000); resolution = (64, 64))'

  gui-test:
    name: GUI Tests / ubuntu-latest / Julia 1.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate GUI dependencies
        shell: bash
        run: julia --startup-file=no --project=FractalsGUI.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Run GUI tests
        shell: bash
        run: julia --startup-file=no --project=FractalsGUI.jl FractalsGUI.jl/test/runtests.jl

  # Builds the Documenter.jl site to catch undocumented exports, broken @ref links, and failing
  # doctests. Nothing is deployed; the built site is uploaded as an artifact.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate docs dependencies
        shell: bash
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        shell: bash
        run: julia --startup-file=no --project=docs docs/make.jl

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build
