name: CI

on:
  push:
    branches:
      - main
      - julia-fractals
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      # Formats in place, then fails with the exact diff if anything changed. JuliaFormatter is
      # pinned so a new release can't change the expected output without a code change.
      - name: Check formatting
        shell: bash
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.add(name="JuliaFormatter", version="1.0.62")
            using JuliaFormatter
            format(["Fractals.jl/src", "Fractals.jl/test"]; overwrite=true)
          '
          if ! git diff --exit-code -- Fractals.jl/src Fractals.jl/test; then
            echo "::error title=Formatting::Fractals.jl/src or Fractals.jl/test is not JuliaFormatter-formatted. Run the formatter (see README) and commit the result."
            exit 1
          fi

  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=Fractals.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        shell: bash
        env:
          FRACTALS_RUN_GPU_TESTS: "0"
          FRACTALS_RUN_CLI_BENCH_TESTS: "0"
        run: julia --startup-file=no --project=Fractals.jl Fractals.jl/test/runtests.jl

      - name: Instantiate DrWatson project
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Smoke-test DrWatson project render
        shell: bash
        env:
          FRACTALS_OUTPUT_ROOT: ${{ runner.temp }}/fractals-output
        run: julia --startup-file=no --project=. Fractals.jl/bin/fractals.jl render --input ifs/Default.ifs --ifs-index 1 --npoints 2000 --resolution 64x64

  gui-test:
    name: GUI Tests / ubuntu-latest / Julia 1.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate GUI dependencies
        shell: bash
        run: julia --startup-file=no --project=FractalsGUI.jl -e 'using Pkg; Pkg.instantiate()'

      - name: Run GUI tests
        shell: bash
        run: julia --startup-file=no --project=FractalsGUI.jl FractalsGUI.jl/test/runtests.jl

  # Builds the Documenter.jl site to catch undocumented exports, broken @ref links, and failing
  # doctests. Nothing is deployed; the built site is uploaded as an artifact.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate docs dependencies
        shell: bash
        run: julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Build docs
        shell: bash
        run: julia --startup-file=no --project=docs docs/make.jl

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build

  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test
      - gui-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmark with targets
        shell: bash
        run: >
          julia --startup-file=no --project=.
          Fractals.jl/bin/fractals.jl benchmark
          --profile small
          --repeats 3
          --targets Fractals.jl/bench/perf_targets.toml
          --json benchmarks/bench_ci.json

      - name: Evaluate regression status (warn/fail)
        shell: bash
        run: |
          julia --startup-file=no --project=. -e '
          using JSON3;
          payload = JSON3.read(read("data/exp_pro/benchmarks/bench_ci.json", String));
          cmp = payload[:comparison];
          status = String(cmp[:status]);
          println("Benchmark comparison status: ", status);
          for (pname, pinfo) in pairs(cmp[:profiles])
              for (opname, opinfo) in pairs(pinfo[:ops])
                  op_status = String(opinfo[:status]);
                  if op_status == "warn"
                      println("::warning title=Benchmark regression warning::profile=$(pname) op=$(opname) status=warn");
                  elseif op_status == "fail"
                      println("::error title=Benchmark regression failure::profile=$(pname) op=$(opname) status=fail");
                  end
              end
          end;
          if status == "fail"
              error("Benchmark regression status is fail");
          end
          '

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci-json
          path: data/exp_pro/benchmarks/bench_ci.json
