name: CI

on:
  push:
    branches:
      - main
      - julia-fractals
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Check formatting
        shell: bash
        run: >
          julia --startup-file=no -e '
          using Pkg;
          Pkg.activate(temp=true);
          Pkg.add(name="JuliaFormatter", version="1");
          using JuliaFormatter;
          ok = format(["Fractals/src", "Fractals/test"]; overwrite=false, verbose=true);
          ok || @warn("Formatting check reported changes. Run JuliaFormatter locally.");
          '

  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=Fractals -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        shell: bash
        run: julia --startup-file=no --project=Fractals Fractals/test/runtests.jl

  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=Fractals -e 'using Pkg; Pkg.instantiate()'

      - name: Run benchmark with targets
        shell: bash
        run: >
          julia --startup-file=no --project=Fractals
          Fractals/bin/fractals.jl benchmark
          --profile small
          --repeats 3
          --targets Fractals/bench/perf_targets.toml
          --json benchmarks/bench_ci.json

      - name: Evaluate regression status (warn/fail)
        shell: bash
        run: |
          julia --startup-file=no --project=Fractals -e '
          using JSON3;
          payload = JSON3.read(read("benchmarks/bench_ci.json", String));
          cmp = payload[:comparison];
          status = String(cmp[:status]);
          println("Benchmark comparison status: ", status);
          for (pname, pinfo) in pairs(cmp[:profiles])
              for (opname, opinfo) in pairs(pinfo[:ops])
                  op_status = String(opinfo[:status]);
                  if op_status == "warn"
                      println("::warning title=Benchmark regression warning::profile=$(pname) op=$(opname) status=warn");
                  elseif op_status == "fail"
                      println("::error title=Benchmark regression failure::profile=$(pname) op=$(opname) status=fail");
                  end
              end
          end;
          if status == "fail"
              error("Benchmark regression status is fail");
          end
          '

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ci-json
          path: benchmarks/bench_ci.json
