name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Check formatting
        shell: bash
        run: >
          julia --startup-file=no -e '
          using Pkg;
          Pkg.activate(temp=true);
          Pkg.add(name="JuliaFormatter", version="1");
          using JuliaFormatter;
          ok = format(["Fractals/src", "Fractals/test"]; overwrite=false, verbose=true);
          ok || error("Formatting check failed. Run JuliaFormatter locally.");
          '

  test:
    name: ${{ matrix.os }} / Julia ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia-version: ['1.10', '1.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Instantiate dependencies
        shell: bash
        run: julia --startup-file=no --project=Fractals -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        shell: bash
        run: julia --startup-file=no --project=Fractals Fractals/test/runtests.jl
