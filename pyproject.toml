[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractals"
version = "0.1.0"
description = "Iterated function system fractal generators and visualizers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8",
  "Pillow>=10.0",
  "animatplot>=0.4",
  "gif>=23.3",
  "ply>=3.11",
  "dotmap>=1.3"
]

[project.optional-dependencies]
manim = ["manim>=0.19"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings>=0.30",
  "mkdocstrings-python>=1.12"
]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fractals = ["ifs/ifs_data/*.ifs"]
